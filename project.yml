name: ApartmentFinder
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  ApartmentCore:
    path: .
  GoogleNavigation:
    url: https://github.com/googlemaps/ios-navigation-sdk
    exactVersion: 11.1.0
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    exactVersion: 11.1.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  ApartmentFinder:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: SharedUI
      - path: data/known-addresses.json
        buildPhase: resources
      - path: data/public-catalog.json
        buildPhase: resources
      - path: data/public-locations.geojson
        buildPhase: resources
      - path: data/public-paths.geojson
        buildPhase: resources
      - path: data/reviewed-baseline-manifest.json
        buildPhase: resources
      - path: data/reviewed-baseline-catalog.json
        buildPhase: resources
      - path: data/reviewed-baseline-locations.geojson
        buildPhase: resources
      - path: data/reviewed-baseline-paths.geojson
        buildPhase: resources
      - path: data/reviewed-progress-catalog.json
        buildPhase: resources
      - path: data/reviewed-progress-locations.geojson
        buildPhase: resources
      - path: data/reviewed-progress-paths.geojson
        buildPhase: resources
    dependencies:
      - package: ApartmentCore
      - package: GoogleNavigation
      - package: GoogleMaps
      - target: ApartmentFinderShare
        embed: true
    info:
      path: build/App-Info.plist
      properties:
        CFBundleDisplayName: ApartmentFinder
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        # Retain the owner's saved answer for this unchanged encryption implementation.
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Delivery manifest
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.zip-archive, public.comma-separated-values-text, public.plain-text]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Show your position and guide you through apartment streets to a saved entrance.
        NSLocationAlwaysAndWhenInUseUsageDescription: Keep active delivery guidance and path recording working while the screen is locked.
        NSMotionUsageDescription: Improve altitude and navigation accuracy during active guidance.
        UIBackgroundModes: [location, audio]
        GoogleNavigationAPIKey: ""
        GoogleAllowedBundleID: ""
        GoogleQuotasVerifiedUntil: ""
        GeocodingProxyURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.galaxybigbird.ApartmentFinder
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/ManifestSharing.entitlements
  ApartmentFinderShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: SharedUI
      - path: data/known-addresses.json
        buildPhase: resources
    dependencies:
      - package: ApartmentCore
    info:
      path: build/Share-Info.plist
      properties:
        CFBundleDisplayName: ApartmentFinder
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.galaxybigbird.ApartmentFinder.Share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/ManifestSharing.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES
  ApartmentFinderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeTests]
    dependencies:
      - target: ApartmentFinder
      - package: ApartmentCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.galaxybigbird.ApartmentFinderTests
        GENERATE_INFOPLIST_FILE: YES
  ApartmentFinderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ApartmentFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.galaxybigbird.ApartmentFinderUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ApartmentFinder:
    build:
      targets:
        ApartmentFinder: all
    test:
      targets:
        - ApartmentFinderTests
        - ApartmentFinderUITests
