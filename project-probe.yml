name: ApartmentFinder
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ApartmentFinder:
    type: application
    platform: iOS
    sources:
      - path: InstallProbe
      - path: data/known-addresses.json
        buildPhase: resources
      - path: data/public-catalog.json
        buildPhase: resources
      - path: data/public-locations.geojson
        buildPhase: resources
      - path: data/public-paths.geojson
        buildPhase: resources
      - path: data/public-set-bootstrap-anchor.json
        buildPhase: resources
      - path: data/public-set-conservation-registry.json
        buildPhase: resources
      - path: data/public-set-baseline-catalog.json
        buildPhase: resources
      - path: data/public-set-baseline-locations.geojson
        buildPhase: resources
      - path: data/public-set-baseline-paths.geojson
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.galaxybigbird.ApartmentFinder
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ApartmentFinder
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
schemes:
  ApartmentFinder:
    build:
      targets:
        ApartmentFinder: all
