name: Frozen candidate unsigned Release and Share check
on:
  workflow_dispatch:
    inputs:
      approve_runner:
        description: Run one free standard public runner without signing or upload
        required: true
        type: boolean
        default: false
      expected_commit:
        description: Frozen reviewed ea20637 candidate
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: apartmentfinder-unsigned-release-${{ inputs.expected_commit }}
  cancel-in-progress: false
jobs:
  unsigned-release:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.approve_runner &&
      github.repository == 'AGForge-Labs/ApartmentFinder-public' && !github.event.repository.private &&
      github.actor_id == '105477711' && github.triggering_actor == 'Galaxybigbird' &&
      inputs.expected_commit == 'ea20637c592c3e16b0edef368b6eb3790fff11ba'
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Require frozen public source and exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_COMMIT" = ea20637c592c3e16b0edef368b6eb3790fff11ba
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(uname -m)" = x86_64
          test "$(xcodebuild -version)" = $'Xcode 26.2\nBuild version 17C52'
          test -z "${APARTMENTFINDER_PRIVATE_PACK_DIRECTORY:-}${APARTMENTFINDER_PRIVATE_SOURCE_DIRECTORY:-}"
          for path in data/catalog.json data/locations.geojson data/paths.geojson private-data private-baselines local-data .env config.local.json; do
            test ! -e "$path"
            test ! -L "$path"
          done
          python3 -B scripts/public-catalog.py validate --directory data
      - name: Build production app and embedded Share extension without signing
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec project.yml
          LOCK=ApartmentFinder.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          mkdir -p "$(dirname "$LOCK")"
          cp Config/Iteration-Package.resolved "$LOCK"
          xcodebuild -project ApartmentFinder.xcodeproj -scheme ApartmentFinder -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -jobs 1 \
            -derivedDataPath "$RUNNER_TEMP/UnsignedRelease" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/UnsignedReleasePackages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify unsigned products and exact reviewed resources
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib,json,os,plistlib,subprocess
          from pathlib import Path
          app=Path(os.environ['RUNNER_TEMP'])/'UnsignedRelease/Build/Products/Release-iphoneos/ApartmentFinder.app'
          share=app/'PlugIns/ApartmentFinderShare.appex'
          for product,identifier,executable in [(app,'dev.galaxybigbird.ApartmentFinder','ApartmentFinder'),(share,'dev.galaxybigbird.ApartmentFinder.Share','ApartmentFinderShare')]:
              assert product.is_dir() and (product/executable).is_file()
              assert plistlib.loads((product/'Info.plist').read_bytes())['CFBundleIdentifier']==identifier
              assert not (product/'_CodeSignature').exists(), 'Unexpected signed product'
          expected=json.loads(Path('data/public-catalog-review.json').read_text())['resourcesSHA256']
          for name,digest in expected.items():
              assert hashlib.sha256((app/name).read_bytes()).hexdigest()==digest, name
          assert hashlib.sha256((share/'known-addresses.json').read_bytes()).hexdigest()==expected['known-addresses.json']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['EXPECTED_COMMIT']
          assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).strip()
          print(json.dumps(dict(scope='unsigned-release-app-and-share',candidate=os.environ['EXPECTED_COMMIT'],harness=os.environ['GITHUB_SHA'],app=True,embeddedShare=True,resourcesMatch=True,distributionSigning=False,upload=False,full_acceptance=False,release_eligible=False,checkout='clean')))
          PY
