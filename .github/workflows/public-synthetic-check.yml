# TEST BRANCH ONLY. This is an intentional red-test diagnostic, not release validation.
name: Public synthetic iOS regression check
on:
  workflow_dispatch:
    inputs:
      approve_runner:
        description: Run one standard public macOS synthetic-only check
        required: true
        type: boolean
        default: false
      expected_commit:
        description: Exact reviewed 40-character commit to test
        required: true
        type: string
      scope:
        description: Regression subset, focused map interaction checks, or text-only activation diagnosis
        required: true
        type: choice
        options: [regression, map-interaction-regression, community-area-controls-regression, map-pinch-diagnostics, activation-diagnostics]
        default: regression
permissions:
  contents: read
concurrency:
  group: overlay-red-only-${{ github.sha }}
  cancel-in-progress: false
jobs:
  red-only:
    if: ${{ inputs.approve_runner && inputs.scope == 'regression' && github.repository == 'AGForge-Labs/ApartmentFinder-public' && github.event.repository.private == false }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require exact reviewed public commit and runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_COMMIT" ]]
          [[ "$(uname -m)" == x86_64 ]]
          [[ "$(xcodebuild -version)" == $'Xcode 26.2\nBuild version 17C52' ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Run exactly the synthetic overlay red cases
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          test -z "${APARTMENTFINDER_PRIVATE_PACK_DIRECTORY:-}${APARTMENTFINDER_PRIVATE_SOURCE_DIRECTORY:-}"
          for input in data/catalog.json data/locations.geojson data/paths.geojson private-data private-baselines; do test ! -e "$input"; done
          set +e
          swift test --jobs 1 --disable-automatic-resolution --skip-update --filter ReviewedProgressOverlayTests > "$RUNNER_TEMP/overlay-red.log" 2>&1
          swift_status=$?
          set -e
          python3 -B scripts/overlay-red-only-verifier.py "$RUNNER_TEMP/overlay-red.log" "$swift_status"
          test -z "$(git status --porcelain --untracked-files=all)"
