name: Owner public source to private TestFlight
on:
  workflow_dispatch:
    inputs:
      authorize_upload:
        description: Sign and upload this exact accepted commit to existing internal TestFlight only
        required: true
        type: boolean
        default: false
      expected_commit:
        description: Exact reviewed 40-character main commit, including this workflow
        required: true
        type: string
      build_number:
        description: Apple build number newer than every existing build; public run numbers are independent
        required: true
        type: string
      accept_known_map_regression:
        description: Reuse the fixed d7f43ed pass, accepting the later pan failure and Simulator crash; application bytes must remain identical
        required: false
        type: boolean
        default: false
      accept_current_ui_test_risk:
        description: Release the identical708ef295 app as27.1 without more tests; retain the disclosed unit-entry UI failure
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-testflight-release
  cancel-in-progress: false
env:
  EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
  RELEASE_AUTHORIZED: ${{ inputs.authorize_upload }}
  RELEASE_KNOWN_MAP_RISK_ACCEPTED: ${{ inputs.accept_known_map_regression }}
  RELEASE_CURRENT_UI_RISK_ACCEPTED: ${{ inputs.accept_current_ui_test_risk }}
  PYTHONDONTWRITEBYTECODE: '1'
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: '1'
jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.authorize_upload &&
      github.repository == 'AGForge-Labs/ApartmentFinder-public' && !github.event.repository.private &&
      github.actor_id == '105477711' && github.triggering_actor == 'Galaxybigbird' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: macos-15-intel
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact owner-reviewed public source
        run: python3 -B scripts/public-release.py check
      - name: Release gate regression checks
        if: ${{ !inputs.accept_current_ui_test_risk }}
        run: python3 -B -m unittest discover -s Tests/release -v
      - name: Preserve existing native and source regression checks
        if: ${{ !inputs.accept_known_map_regression && !inputs.accept_current_ui_test_risk }}
        shell: bash
        run: bash scripts/public-release-validation.sh
      - name: Verify fixed prior acceptance and identical application source under explicit risk acceptance
        if: ${{ inputs.accept_known_map_regression && !inputs.accept_current_ui_test_risk }}
        run: python3 -B scripts/public-release-recovery.py
      - name: Verify identical application source and retain the disclosed UI failure without rerunning tests
        if: ${{ inputs.accept_current_ui_test_risk }}
        run: python3 -B scripts/public-release-current-ui-risk.py
  release:
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    environment:
      name: release
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      RELEASE_ENVIRONMENT: release
      RELEASE_ACCEPTED_COMMIT: ${{ vars.RELEASE_ACCEPTED_COMMIT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare the existing project generator
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Sign, verify and upload without public package or raw signing logs
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_SHARE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_SHARE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: python3 -B scripts/public-release.py sign-upload
