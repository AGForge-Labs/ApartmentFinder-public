name: Focused native map check
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact source commit to check on one standard Mac
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: focused-map-check
  cancel-in-progress: false
jobs:
  map:
    if: github.repository == 'AGForge-Labs/ApartmentFinder-public' && github.actor_id == '105477711'
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile and check native pins and map interactions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec project.yml
          LOCK=ApartmentFinder.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          mkdir -p "$(dirname "$LOCK")"
          cp Config/Iteration-Package.resolved "$LOCK"
          DEVICE=$(xcrun simctl create MapPerformance com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-26-2)
          trap 'xcrun simctl shutdown "$DEVICE" >/dev/null 2>&1 || true; xcrun simctl delete "$DEVICE" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project ApartmentFinder.xcodeproj -scheme ApartmentFinder \
            -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build-simulator \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -jobs 2 -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            -only-testing:ApartmentFinderTests/NativeDeliveryMapTests \
            -only-testing:ApartmentFinderUITests/OnTracFlowTests/testSourceUnitPinAppearsOnMapAfterOnTracImport \
            -only-testing:ApartmentFinderUITests/HeadingUpNavigationTests/testResumePreservesActualPinchZoomAndSelectedStop \
            test > "$RUNNER_TEMP/map-check.log" 2>&1 || {
              tail -n 100 "$RUNNER_TEMP/map-check.log"; exit 1;
            }
          grep -E "Test Case .* (passed|failed)|Executed .* tests|TEST SUCCEEDED" "$RUNNER_TEMP/map-check.log"
          git diff --exit-code
